name: Ventus Therapeutics
description: >-
  Ventus Therapeutics is a clinical-stage biopharmaceutical company based in
  Waltham, Massachusetts, with research operations in Montreal, Canada. Ventus
  uses its proprietary, machine-learning-enabled computational chemistry and
  structural biology platform, ReSOLVE, together with deep protein-science
  expertise, to design differentiated small-molecule therapeutics targeting the
  innate immune system (including cGAS and NLRP3 inhibitors) for autoimmune and
  inflammatory diseases, neurological disorders, and cancer. It was surfaced as
  an a16z portfolio company and added to the API Evangelist network. Enrichment
  confirmed Ventus operates a corporate/investor website only and publishes no
  public developer API, SDK, OpenAPI, MCP server, or /.well-known discovery
  surface.
